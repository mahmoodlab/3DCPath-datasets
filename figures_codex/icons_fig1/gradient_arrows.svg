<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
  <defs>
    <linearGradient id="topGradient" x1="250" y1="560" x2="680" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#28A9D7"/>
      <stop offset="0.55" stop-color="#486FBE"/>
      <stop offset="1" stop-color="#9A44B7"/>
    </linearGradient>

    <linearGradient id="bottomGradient" x1="190" y1="900" x2="1120" y2="1470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#28A9D7"/>
      <stop offset="0.5" stop-color="#4B72C2"/>
      <stop offset="1" stop-color="#A33DB1"/>
    </linearGradient>
  </defs>

  <!--
    RECOMMENDED FOR ILLUSTRATOR:
    These are stroke-based arrows. Select each shaft path and adjust Stroke Weight
    to control arrow thickness. Arrowheads are separate editable triangles.
  -->
  <g id="stroke-arrows-editable">
    <g id="top-rounded-arrow">
      <path
        id="top-rounded-arrow-shaft"
        d="M 250 560 L 250 270 C 250 202 302 150 370 150 L 530 150"
        fill="none"
        stroke="url(#topGradient)"
        stroke-width="40"
        stroke-linecap="butt"
        stroke-linejoin="round"/>
      <path
        id="top-rounded-arrow-head"
        d="M 530 95 L 660 150 L 530 205 Z"
        fill="#9A44B7"/>
    </g>

    <g id="bottom-rounded-arrow">
      <path
        id="bottom-rounded-arrow-shaft"
        d="M 190 900 L 190 1260 C 190 1378 282 1470 400 1470 L 965 1470"
        fill="none"
        stroke="url(#bottomGradient)"
        stroke-width="40"
        stroke-linecap="butt"
        stroke-linejoin="round"/>
      <path
        id="bottom-rounded-arrow-head"
        d="M 965 1415 L 1095 1470 L 965 1525 Z"
        fill="#A33DB1"/>
    </g>

    <g id="straight-arrow-optional" display="none">
      <path
        id="straight-arrow-shaft"
        d="M 160 790 L 955 790"
        fill="none"
        stroke="url(#bottomGradient)"
        stroke-width="30"
        stroke-linecap="butt"/>
      <path
        id="straight-arrow-head"
        d="M 955 748 L 1060 790 L 955 832 Z"
        fill="#A33DB1"/>
    </g>
  </g>

  <!--
    Optional filled examples are hidden by default so they do not overlap.
    Turn display on in Illustrator only if you want closed shape versions.
  -->
  <g id="filled-arrows-hidden" display="none">
    <path
      d="M 220 560 L 220 270 C 220 185 285 120 370 120 L 545 120 L 545 96 L 650 150 L 545 204 L 545 180 L 370 180 C 318 180 280 218 280 270 L 280 560 Z"
      fill="url(#topGradient)"/>
    <path
      d="M 220 900 L 220 1260 C 220 1360 300 1440 400 1440 L 1000 1440 L 1000 1418 L 1110 1470 L 1000 1522 L 1000 1500 L 400 1500 C 265 1500 160 1395 160 1260 L 160 900 Z"
      fill="url(#bottomGradient)"/>
  </g>
</svg>
