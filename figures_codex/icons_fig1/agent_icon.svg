<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="headGradient" x1="120" y1="130" x2="392" y2="356" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#64B7E8"/>
      <stop offset="0.55" stop-color="#8DBDE8"/>
      <stop offset="1" stop-color="#B98AD8"/>
    </linearGradient>

    <linearGradient id="visorGradient" x1="160" y1="210" x2="352" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#123E63"/>
      <stop offset="1" stop-color="#235D95"/>
    </linearGradient>

    <linearGradient id="signalGradient" x1="160" y1="72" x2="352" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#26A9D7"/>
      <stop offset="1" stop-color="#B13CB1"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1F2C3A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <g id="agent-icon" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Signal nodes -->
    <path d="M 196 126 L 176 78" stroke="#173F63" stroke-width="16"/>
    <path d="M 256 116 L 256 62" stroke="#173F63" stroke-width="16"/>
    <path d="M 316 126 L 336 78" stroke="#173F63" stroke-width="16"/>

    <circle cx="176" cy="70" r="20" fill="#FF5F7D" stroke="#173F63" stroke-width="14"/>
    <circle cx="256" cy="54" r="20" fill="#35B9DF" stroke="#173F63" stroke-width="14"/>
    <circle cx="336" cy="70" r="20" fill="#FF5F7D" stroke="#173F63" stroke-width="14"/>

    <!-- Body outline -->
    <path
      d="M 150 440 C 150 376 198 330 256 330 C 314 330 362 376 362 440 L 362 456 L 150 456 Z"
      fill="#EEF3FF"
      stroke="#173F63"
      stroke-width="18"/>

    <path d="M 218 338 L 218 292 L 294 292 L 294 338" fill="#7B97CA" stroke="#173F63" stroke-width="18"/>

    <!-- Head and ears -->
    <path d="M 114 218 C 88 218 70 238 70 264 C 70 290 88 310 114 310" fill="#7D99CF" stroke="#173F63" stroke-width="18"/>
    <path d="M 398 218 C 424 218 442 238 442 264 C 442 290 424 310 398 310" fill="#7D99CF" stroke="#173F63" stroke-width="18"/>

    <rect
      x="112"
      y="126"
      width="288"
      height="204"
      rx="72"
      fill="url(#headGradient)"
      stroke="#173F63"
      stroke-width="18"
      filter="url(#softShadow)"/>

    <!-- Visor -->
    <rect x="156" y="198" width="200" height="86" rx="38" fill="#F8FBFF" stroke="#173F63" stroke-width="16"/>
    <rect x="176" y="218" width="160" height="46" rx="23" fill="url(#visorGradient)"/>

    <!-- Eyes -->
    <circle cx="224" cy="241" r="15" fill="#F8FBFF"/>
    <circle cx="288" cy="241" r="15" fill="#F8FBFF"/>
    <circle cx="224" cy="241" r="6" fill="#173F63"/>
    <circle cx="288" cy="241" r="6" fill="#173F63"/>

    <!-- Small circuit motif -->
    <path d="M 214 410 L 214 382 L 256 382 L 256 456" stroke="#173F63" stroke-width="14"/>
    <path d="M 298 410 L 298 382 L 256 382" stroke="#173F63" stroke-width="14"/>
    <circle cx="214" cy="374" r="14" fill="#FF5F7D" stroke="#173F63" stroke-width="10"/>
    <circle cx="298" cy="374" r="14" fill="#FF5F7D" stroke="#173F63" stroke-width="10"/>

    <!-- Accent bolts -->
    <path d="M 138 94 L 118 122 L 138 122 L 122 150" stroke="url(#signalGradient)" stroke-width="12"/>
    <path d="M 374 94 L 394 122 L 374 122 L 390 150" stroke="url(#signalGradient)" stroke-width="12"/>
  </g>
</svg>
