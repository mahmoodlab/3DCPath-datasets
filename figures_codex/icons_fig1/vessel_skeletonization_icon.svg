<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <defs>
    <linearGradient id="vesselFill" x1="180" y1="420" x2="660" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B9BEC4" stop-opacity="0.60"/>
      <stop offset="0.55" stop-color="#D8DADD" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#AEB5BC" stop-opacity="0.58"/>
    </linearGradient>

    <linearGradient id="skeletonBlue" x1="220" y1="380" x2="650" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1B4C9C"/>
      <stop offset="1" stop-color="#238ACB"/>
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1D2733" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="900" height="520" fill="#FFFFFF"/>

  <g id="vessel-skeletonization-icon" stroke-linecap="round" stroke-linejoin="round">
    <!-- Translucent segmented vessel volume -->
    <g id="vessel-volume" fill="url(#vesselFill)" stroke="#8C949C" stroke-width="2.5" opacity="0.92" filter="url(#softShadow)">
      <path d="M 240 430 C 230 382 244 330 286 294 C 323 262 365 247 402 214 C 435 185 460 138 490 92 C 508 64 548 86 532 118 C 506 171 474 214 438 250 C 402 287 358 306 326 334 C 296 362 286 400 294 430 Z"/>
      <path d="M 403 216 C 426 178 423 134 408 92 C 396 59 438 43 453 75 C 478 130 475 186 444 238 Z"/>
      <path d="M 427 244 C 474 238 524 222 563 190 C 594 164 623 202 596 228 C 552 269 493 287 442 291 Z"/>
      <path d="M 331 327 C 290 299 260 257 240 216 C 225 184 268 165 285 197 C 306 237 334 268 371 288 Z"/>
      <path d="M 314 347 C 266 356 224 383 198 420 C 178 449 136 424 158 392 C 193 341 246 310 304 299 Z"/>
      <path d="M 492 178 C 534 139 577 118 628 104 C 664 94 677 139 642 149 C 594 164 556 185 519 220 Z"/>
      <path d="M 511 264 C 551 290 591 319 626 358 C 650 386 614 418 589 390 C 556 354 522 329 482 303 Z"/>
    </g>

    <!-- Skeleton edges -->
    <g id="skeleton-edges" fill="none" stroke="url(#skeletonBlue)" stroke-width="8">
      <path d="M 266 420 L 291 335 L 350 292 L 425 245 L 505 110"/>
      <path d="M 425 245 L 430 91"/>
      <path d="M 425 245 L 571 209"/>
      <path d="M 350 292 L 264 207"/>
      <path d="M 291 335 L 178 405"/>
      <path d="M 505 110 L 640 126"/>
      <path d="M 425 245 L 604 374"/>
    </g>

    <!-- Alternative contracted graph overlay -->
    <g id="topology-overlay" fill="none" stroke="#43A047" stroke-width="4.5" opacity="0.85">
      <path d="M 266 420 L 291 335 L 425 245 L 505 110"/>
      <path d="M 425 245 L 571 209"/>
      <path d="M 350 292 L 264 207"/>
      <path d="M 425 245 L 604 374"/>
    </g>

    <!-- Skeleton nodes -->
    <g id="skeleton-nodes" fill="#14266F" stroke="#FFFFFF" stroke-width="3">
      <circle cx="266" cy="420" r="12"/>
      <circle cx="291" cy="335" r="12"/>
      <circle cx="350" cy="292" r="12"/>
      <circle cx="425" cy="245" r="14"/>
      <circle cx="505" cy="110" r="12"/>
      <circle cx="430" cy="91" r="11"/>
      <circle cx="571" cy="209" r="11"/>
      <circle cx="264" cy="207" r="11"/>
      <circle cx="178" cy="405" r="11"/>
      <circle cx="640" cy="126" r="11"/>
      <circle cx="604" cy="374" r="11"/>
    </g>

    <!-- Small tumor/invasion cue -->
    <g id="tumor-invasion-cue">
      <path d="M 674 270 C 697 247 739 251 758 279 C 777 307 762 350 728 361 C 689 374 646 344 650 307 C 652 294 662 282 674 270 Z"
        fill="#F2B25B" stroke="#8B5B1E" stroke-width="3" opacity="0.92"/>
      <circle cx="694" cy="292" r="13" fill="#F7C777" stroke="#8B5B1E" stroke-width="2"/>
      <circle cx="726" cy="312" r="11" fill="#F7C777" stroke="#8B5B1E" stroke-width="2"/>
      <circle cx="700" cy="337" r="10" fill="#F7C777" stroke="#8B5B1E" stroke-width="2"/>
      <path d="M 650 307 C 615 306 604 293 571 209" fill="none" stroke="#F2B25B" stroke-width="7" stroke-dasharray="12 10"/>
    </g>

    <!-- Minimal legend dots, editable or removable -->
    <g id="mini-legend" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#252525">
      <circle cx="72" cy="74" r="12" fill="#14266F"/>
      <text x="94" y="83">skeleton graph</text>
      <path d="M 58 118 L 86 118" stroke="#8C949C" stroke-width="12" opacity="0.58"/>
      <text x="94" y="127">vessel volume</text>
    </g>
  </g>
</svg>
