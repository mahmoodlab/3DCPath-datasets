<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560">
  <defs>
    <clipPath id="boxClip">
      <polygon points="110,170 370,90 790,215 790,420 500,515 110,390"/>
    </clipPath>
  </defs>

  <rect width="900" height="560" fill="#FFFFFF"/>

  <g id="vessel-network-in-3d-box">
    <image
      href="vessel_network_red_volume_dark_skeleton.png"
      x="35"
      y="70"
      width="830"
      height="430"
      preserveAspectRatio="xMidYMid slice"
      clip-path="url(#boxClip)"
      opacity="0.96"/>

    <!-- Back/top wireframe -->
    <g id="gray-box-wireframe" fill="none" stroke="#C9C9C9" stroke-width="3" stroke-linejoin="round">
      <polygon points="110,170 370,90 790,215 500,300"/>
      <polygon points="110,170 500,300 500,515 110,390"/>
      <polygon points="500,300 790,215 790,420 500,515"/>
      <polygon points="110,170 370,90 790,215 790,420 500,515 110,390"/>
      <line x1="370" y1="90" x2="370" y2="300"/>
      <line x1="500" y1="300" x2="500" y2="515"/>
      <line x1="110" y1="390" x2="500" y2="300"/>
      <line x1="790" y1="420" x2="500" y2="300"/>
    </g>
  </g>
</svg>
