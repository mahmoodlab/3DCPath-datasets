<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
  <defs>
    <style>
      .ink{fill:none;stroke:#3a3a3a;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
      .thin{fill:none;stroke:#6f7378;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .metal{fill:#dce3e8;stroke:#6f7378;stroke-width:6;stroke-linejoin:round}
      .handle{fill:#3a3a3a;stroke:#252525;stroke-width:5;stroke-linejoin:round}
      .accent{fill:#f7d8ac;stroke:#6f7378;stroke-width:6;stroke-linejoin:round}
      .cut{fill:none;stroke:#b44747;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <!-- Option 1: simple scalpel -->
  <g transform="translate(80 50) rotate(-35 100 100)">
    <rect class="handle" x="98" y="78" width="165" height="34" rx="17"/>
    <path class="metal" d="M48 78h64v34H48C26 112 14 100 14 95s12-17 34-17z"/>
    <path class="thin" d="M120 95h110"/>
  </g>

  <!-- Option 2: scalpel with prostate outline -->
  <g transform="translate(330 35)">
    <path class="accent" d="M96 158c-35-5-61-34-61-70 0-25 13-47 32-59 11 12 28 18 46 18s35-6 46-18c20 12 32 34 32 59 0 36-26 65-61 70-8 2-15-6-17-16-2 10-9 18-17 16z"/>
    <path class="thin" d="M113 47v102"/>
    <g transform="translate(62 46) rotate(-35 95 88)">
      <rect class="handle" x="104" y="76" width="134" height="28" rx="14"/>
      <path class="metal" d="M56 76h58v28H56c-19 0-30-10-30-14s11-14 30-14z"/>
      <path class="thin" d="M122 90h83"/>
    </g>
  </g>

  <!-- Option 3: surgical removal / radical treatment -->
  <g transform="translate(620 40)">
    <path class="accent" d="M96 152c-32-5-56-31-56-64 0-23 12-43 30-55 10 11 26 17 43 17s33-6 43-17c18 12 30 32 30 55 0 33-24 59-56 64-8 1-14-5-17-15-3 10-9 16-17 15z"/>
    <path class="cut" d="M72 103c25-24 56-25 83-2"/>
    <path class="thin" d="M174 42l34-34"/>
    <path class="thin" d="M199 43h35"/>
    <path class="thin" d="M173 17V-18"/>
    <g transform="translate(70 116) rotate(-28 85 55)">
      <rect class="handle" x="88" y="46" width="118" height="25" rx="13"/>
      <path class="metal" d="M47 46h48v25H47c-16 0-25-8-25-12s9-13 25-13z"/>
    </g>
  </g>
</svg>
