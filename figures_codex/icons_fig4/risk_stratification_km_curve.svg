<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1800" viewBox="0 0 1800 1800">
  <defs>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 138px; font-weight: 700; fill: #000000; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 110px; font-weight: 400; fill: #000000; }
      .tick-label { font-family: Arial, Helvetica, sans-serif; font-size: 82px; font-weight: 400; fill: #000000; }
      .legend { font-family: Arial, Helvetica, sans-serif; font-size: 86px; font-weight: 400; fill: #000000; }
      .axis { fill: none; stroke: #000000; stroke-width: 8; stroke-linecap: square; }
      .tick { stroke: #000000; stroke-width: 8; stroke-linecap: square; }
      .minor-tick { stroke: #000000; stroke-width: 7; stroke-linecap: square; }
      .high { fill: none; stroke: #ef2a23; stroke-width: 15; stroke-linecap: square; stroke-linejoin: round; }
      .low { fill: none; stroke: #3c55a3; stroke-width: 15; stroke-linecap: square; stroke-linejoin: round; }
      .high-censor { fill: none; stroke: #ef2a23; stroke-width: 12; stroke-linecap: square; }
      .low-censor { fill: none; stroke: #3c55a3; stroke-width: 12; stroke-linecap: square; }
    </style>
  </defs>

  <rect width="1800" height="1800" fill="#ffffff"/>

  <text class="title" x="170" y="165">Risk stratification</text>

  <g id="axes">
    <path class="axis" d="M360 1290 H1600"/>
    <path class="axis" d="M360 1290 V285"/>

    <g id="y-ticks">
      <path class="tick" d="M348 1290 H360"/>
      <path class="tick" d="M348 1107 H360"/>
      <path class="tick" d="M348 925 H360"/>
      <path class="tick" d="M348 743 H360"/>
      <path class="tick" d="M348 561 H360"/>
      <path class="tick" d="M348 379 H360"/>
      <text class="tick-label" x="180" y="1318">0.0</text>
      <text class="tick-label" x="180" y="1135">0.2</text>
      <text class="tick-label" x="180" y="953">0.4</text>
      <text class="tick-label" x="180" y="771">0.6</text>
      <text class="tick-label" x="180" y="589">0.8</text>
      <text class="tick-label" x="180" y="407">1.0</text>
    </g>

    <g id="x-ticks">
      <path class="minor-tick" d="M418 1290 V1302"/>
      <path class="minor-tick" d="M602 1290 V1302"/>
      <path class="minor-tick" d="M785 1290 V1302"/>
      <path class="minor-tick" d="M968 1290 V1302"/>
      <path class="minor-tick" d="M1152 1290 V1302"/>
      <path class="minor-tick" d="M1335 1290 V1302"/>
      <path class="minor-tick" d="M1518 1290 V1302"/>
    </g>
  </g>

  <g id="km-curves">
    <path class="low" d="M415 379 H552 V424 H580 V470 H740 V515 H1030 V560 H1362 V606 H1494"/>
    <path class="high" d="M415 379 H500 V424 H523 V470 H545 V515 H625 V561 H700 V606 H842 V652 H865 V697 H938 V743 H980 V789 H1030 V834 H1080 V880 H1128 V925 H1160 V970 H1188 V1016 H1240 V1061 H1485 V1107 H1520 V1143 H1562"/>

    <path class="low-censor" d="M1494 570 V642 M1458 606 H1530"/>
    <path class="high-censor" d="M1538 1107 V1179 M1502 1143 H1574"/>
  </g>

  <g id="legend">
    <path class="high" d="M430 1057 H538"/>
    <text class="legend" x="585" y="1095">High risk</text>
    <path class="low" d="M430 1177 H538"/>
    <text class="legend" x="585" y="1215">Low risk</text>
  </g>

  <text class="label" x="910" y="1500" text-anchor="middle">Time</text>
  <text class="label" x="115" y="790" text-anchor="middle" transform="rotate(-90 115 790)">Proportion recurrence</text>
</svg>
