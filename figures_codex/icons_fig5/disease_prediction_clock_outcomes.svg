<svg xmlns="http://www.w3.org/2000/svg" width="520" height="420" viewBox="0 0 520 420">
  <defs>
    <style>
      .line {
        fill: none;
        stroke: #303030;
        stroke-width: 6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .thin {
        fill: none;
        stroke: #303030;
        stroke-width: 4.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .accent {
        fill: none;
        stroke: #c63a49;
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .blue {
        fill: none;
        stroke: #176fb8;
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .green {
        fill: none;
        stroke: #4b8239;
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#303030"/>
    </marker>
  </defs>

  <!-- central prediction clock -->
  <circle class="line" cx="260" cy="210" r="122"/>
  <path class="line" d="M260 210 V132" marker-end="url(#arrow)"/>
  <path class="line" d="M260 210 L320 268" marker-end="url(#arrow)"/>
  <path class="thin" d="M374 168 C402 206 398 254 366 288" marker-end="url(#arrow)"/>
  <path class="thin" d="M146 252 C120 216 123 166 153 132" marker-end="url(#arrow)"/>

  <!-- cancer spread: primary mass with small satellite foci -->
  <g transform="translate(82 76)">
    <circle class="accent" cx="38" cy="36" r="23"/>
    <circle class="accent" cx="20" cy="51" r="11"/>
    <circle class="accent" cx="64" cy="55" r="10"/>
    <circle class="accent" cx="31" cy="18" r="8"/>
    <circle cx="74" cy="24" r="5" fill="#c63a49"/>
    <circle cx="9" cy="27" r="4.5" fill="#c63a49"/>
    <circle cx="51" cy="75" r="4.5" fill="#c63a49"/>
    <path class="accent" d="M38 36 C52 21 61 18 74 24"/>
    <path class="accent" d="M38 36 C21 35 14 31 9 27"/>
    <path class="accent" d="M38 36 C47 52 49 63 51 75"/>
  </g>

  <!-- metastasis: distant organ with tumor seed -->
  <g transform="translate(383 70)">
    <path class="thin" d="M24 68 C7 52 10 24 33 18 C55 13 72 28 75 49 C79 74 51 88 24 68 Z"/>
    <path class="thin" d="M56 19 C59 8 69 3 82 8"/>
    <path class="thin" d="M72 48 C84 47 94 55 97 67"/>
    <circle cx="46" cy="51" r="10" fill="#c63a49"/>
    <path class="accent" d="M8 11 C22 20 31 31 41 43"/>
    <path class="accent" d="M5 11 H-10"/>
  </g>

  <!-- lymphatic invasion: vessel with migrating tumor cells -->
  <g transform="translate(382 283)">
    <path class="blue" d="M10 42 C38 13 73 13 101 42"/>
    <path class="blue" d="M10 78 C38 49 73 49 101 78"/>
    <path class="thin" d="M15 31 V90 M96 31 V90"/>
    <circle cx="39" cy="50" r="8" fill="#c63a49"/>
    <circle cx="61" cy="60" r="7" fill="#c63a49"/>
    <circle cx="78" cy="47" r="6" fill="#c63a49"/>
    <path class="accent" d="M27 70 C46 78 68 78 86 68"/>
  </g>

  <!-- treatment / intervention: simple hand and medicine tag -->
  <g transform="translate(68 283)">
    <path class="thin" d="M15 62 H55 C71 62 80 51 89 40"/>
    <path class="thin" d="M35 62 V35 C35 25 47 24 49 34 L54 52"/>
    <path class="thin" d="M55 52 V25 C55 15 68 15 69 26 L72 50"/>
    <path class="thin" d="M73 50 V30 C73 21 85 21 87 31 L90 53"/>
    <path class="thin" d="M92 52 L110 35"/>
    <path class="green" d="M8 79 H60"/>
    <rect class="thin" x="101" y="45" width="30" height="42" rx="5"/>
    <path class="green" d="M111 66 H121 M116 61 V71"/>
  </g>
</svg>
